version: "3.9"

services:
  distribution-tracker:
    build: .
    container_name: distribution-tracker
    restart: unless-stopped
    ports:
      # Le port hôte ET le port container suivent la variable PORT
      # Portainer : définir PORT=3078 (ou autre) dans les variables d'environnement
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - distribution-data:/data
    environment:
      - PORT=${PORT:-3000}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - BASE_URL=${BASE_URL:-}
      - DATA_DIR=${DATA_DIR:-/data}

volumes:
  distribution-data:
    driver: local
