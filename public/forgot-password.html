<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display:flex;align-items:center;justify-content:center;height:100vh;
      background:linear-gradient(135deg,#1565C0,#0D47A1);padding:16px; }
    .box { width:100%;max-width:400px;background:#fff;border-radius:16px;padding:36px 28px;box-shadow:0 8px 40px rgba(0,0,0,.2); }
    .icon { font-size:44px;text-align:center;margin-bottom:12px; }
  </style>
</head>
<body>
<div class="box">
  <div class="icon">🔑</div>
  <h2 style="text-align:center;font-size:20px;margin-bottom:6px;">Mot de passe oublié</h2>
  <p style="text-align:center;color:#607D8B;font-size:14px;margin-bottom:24px;">
    Entrez votre email pour recevoir un lien de réinitialisation (si le SMTP est configuré).
  </p>

  <div id="form-area">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="votre@email.fr" required>
    </div>
    <button class="btn btn-primary w-full" id="submit-btn" onclick="submit()">Envoyer le lien</button>
    <p id="error-msg" style="color:#C62828;font-size:13px;margin-top:8px;display:none;"></p>
  </div>

  <div id="success-area" style="display:none;text-align:center;">
    <div style="font-size:40px;margin-bottom:12px;">✅</div>
    <p style="font-weight:600;margin-bottom:6px;">Email envoyé !</p>
    <p style="color:#607D8B;font-size:14px;">Si votre email est reconnu et que le SMTP est configuré, vous recevrez un lien sous peu.</p>
  </div>

  <div style="text-align:center;margin-top:20px;">
    <a href="login.html" style="color:var(--primary);font-size:13px;text-decoration:none;">← Retour à la connexion</a>
  </div>
</div>
<script>
async function submit() {
  const btn = document.getElementById('submit-btn');
  const email = document.getElementById('email').value.trim();
  if (!email) return;
  btn.disabled = true; btn.textContent = 'Envoi…';
  await fetch('/api/auth/forgot-password', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email })
  });
  document.getElementById('form-area').style.display = 'none';
  document.getElementById('success-area').style.display = '';
}
</script>
</body>
</html>
