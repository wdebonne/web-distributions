<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1565C0" id="meta-theme">
  <title>Mot de passe oublié</title>
  <link rel="stylesheet" href="style.css">
  <link id="dyn-favicon" rel="icon" href="data:,">
  <style>
    html, body { height:100%; overflow:auto; }
    body {
      display:flex; align-items:center; justify-content:center;
      padding:20px; min-height:100vh;
      background:linear-gradient(150deg, var(--lp-from,#1565C0) 0%, var(--lp-to,#0D47A1) 100%);
    }
    .auth-card {
      width:100%; max-width:400px;
      background:#fff; border-radius:20px;
      padding:36px 28px; box-shadow:0 24px 64px rgba(0,0,0,.28);
      animation:cardIn .35s ease;
    }
    @keyframes cardIn { from{opacity:0;transform:translateY(14px);} to{opacity:1;transform:translateY(0);} }
    .auth-icon { font-size:44px; text-align:center; margin-bottom:14px; }
    .auth-title { font-size:21px; font-weight:800; text-align:center; margin-bottom:6px; color:var(--text); }
    .auth-sub   { font-size:14px; color:var(--text-light); text-align:center; margin-bottom:24px; line-height:1.5; }
    .auth-success { text-align:center; }
    .auth-success-icon { font-size:48px; margin-bottom:14px; }
    .auth-success-title { font-weight:700; font-size:16px; margin-bottom:8px; }
    .auth-success-text  { font-size:14px; color:var(--text-light); line-height:1.5; }
    .auth-back { text-align:center; margin-top:20px; }
    .auth-back a { color:var(--primary); font-size:13px; text-decoration:none; font-weight:500; }
    .auth-back a:hover { text-decoration:underline; }
    .auth-error {
      background:#FFEBEE; border:1px solid #FFCDD2; color:#C62828;
      border-radius:8px; padding:10px 14px; font-size:13px;
      margin-bottom:14px; display:none;
    }
  </style>
</head>
<body>
<div class="auth-card">
  <div class="auth-icon">🔑</div>
  <div class="auth-title">Mot de passe oublié</div>
  <div class="auth-sub">Entrez votre email pour recevoir un lien de réinitialisation (si le SMTP est configuré).</div>

  <div id="form-area">
    <div class="auth-error" id="error-msg"></div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="votre@email.fr" required autofocus>
    </div>
    <button class="btn btn-primary w-full" id="submit-btn" onclick="submit()">Envoyer le lien</button>
  </div>

  <div id="success-area" class="auth-success" style="display:none;">
    <div class="auth-success-icon">✅</div>
    <div class="auth-success-title">Email envoyé !</div>
    <div class="auth-success-text">Si votre email est reconnu et que le SMTP est configuré, vous recevrez un lien de réinitialisation sous peu.</div>
  </div>

  <div class="auth-back">
    <a href="login.html">← Retour à la connexion</a>
  </div>
</div>

<script>
(async function applyBranding() {
  try {
    const r = await fetch('/api/settings'); if (!r.ok) return;
    const s = await r.json();
    const root = document.documentElement;
    const p = s.primary_color;
    if (p && /^#[0-9a-fA-F]{6}$/.test(p)) {
      root.style.setProperty('--primary', p);
      document.getElementById('meta-theme').content = p;
    }
    const gf = s.login_gradient_from || p || '#1565C0';
    const gt = s.login_gradient_to   || '#0D47A1';
    root.style.setProperty('--lp-from', gf);
    root.style.setProperty('--lp-to',   gt);
    if (s.favicon_url) document.getElementById('dyn-favicon').href = s.favicon_url;
  } catch(e) {}
})();

async function submit() {
  const btn = document.getElementById('submit-btn');
  const err = document.getElementById('error-msg');
  const email = document.getElementById('email').value.trim();
  if (!email) return;
  btn.disabled = true; btn.textContent = 'Envoi…'; err.style.display = 'none';
  await fetch('/api/auth/forgot-password', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ email })
  });
  document.getElementById('form-area').style.display = 'none';
  document.getElementById('success-area').style.display = '';
}
</script>
</body>
</html>
