<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1565C0" id="meta-theme">
  <title>Changer de mot de passe</title>
  <link rel="stylesheet" href="style.css">
  <link id="dyn-favicon" rel="icon" href="data:,">
  <style>
    html, body { height:100%; overflow:auto; }
    body {
      display:flex; align-items:center; justify-content:center;
      padding:20px; min-height:100vh;
      background:linear-gradient(150deg, var(--lp-from,#1565C0) 0%, var(--lp-to,#0D47A1) 100%);
    }
    .auth-card {
      width:100%; max-width:400px;
      background:#fff; border-radius:20px;
      padding:36px 28px; box-shadow:0 24px 64px rgba(0,0,0,.28);
      animation:cardIn .35s ease;
    }
    @keyframes cardIn { from{opacity:0;transform:translateY(14px);} to{opacity:1;transform:translateY(0);} }
    .auth-icon  { font-size:44px; text-align:center; margin-bottom:14px; }
    .auth-title { font-size:21px; font-weight:800; text-align:center; margin-bottom:6px; color:var(--text); }
    .auth-sub   { font-size:14px; color:var(--text-light); text-align:center; margin-bottom:24px; line-height:1.5; }
    .auth-error {
      background:#FFEBEE; border:1px solid #FFCDD2; color:#C62828;
      border-radius:8px; padding:10px 14px; font-size:13px;
      margin-bottom:14px; display:none;
    }
    .auth-info {
      background:var(--primary-light); border:1px solid #90CAF9; color:var(--primary-dark);
      border-radius:8px; padding:10px 14px; font-size:13px;
      margin-bottom:20px; line-height:1.5;
    }
    .pwd-wrap { position:relative; }
    .pwd-toggle {
      position:absolute; right:12px; top:50%; transform:translateY(-50%);
      background:none; border:none; cursor:pointer; color:var(--text-light);
      font-size:16px; padding:4px; border-radius:6px;
    }
  </style>
</head>
<body>
<div class="auth-card">
  <div class="auth-icon">🔐</div>
  <div class="auth-title">Changer votre mot de passe</div>
  <div class="auth-sub">Pour des raisons de sécurité, veuillez définir un nouveau mot de passe personnel.</div>

  <div class="auth-info">
    🛡️ Choisissez un mot de passe d'au moins 8 caractères, différent de votre mot de passe temporaire.
  </div>

  <div class="auth-error" id="err"></div>

  <div class="form-group">
    <label>Mot de passe actuel</label>
    <div class="pwd-wrap">
      <input type="password" id="current" placeholder="••••••••">
      <button type="button" class="pwd-toggle" onclick="togglePwd('current',this)">👁</button>
    </div>
  </div>
  <div class="form-group">
    <label>Nouveau mot de passe</label>
    <div class="pwd-wrap">
      <input type="password" id="new1" placeholder="Minimum 8 caractères">
      <button type="button" class="pwd-toggle" onclick="togglePwd('new1',this)">👁</button>
    </div>
  </div>
  <div class="form-group">
    <label>Confirmer le nouveau mot de passe</label>
    <div class="pwd-wrap">
      <input type="password" id="new2" placeholder="••••••••">
      <button type="button" class="pwd-toggle" onclick="togglePwd('new2',this)">👁</button>
    </div>
  </div>

  <button class="btn btn-primary w-full" onclick="submit()" id="submit-btn">Enregistrer</button>
</div>

<script>
(async function applyBranding() {
  try {
    const r = await fetch('/api/settings'); if (!r.ok) return;
    const s = await r.json();
    const root = document.documentElement;
    const p = s.primary_color;
    if (p && /^#[0-9a-fA-F]{6}$/.test(p)) {
      root.style.setProperty('--primary', p);
      root.style.setProperty('--primary-light', (()=>{const{r,g,b}={r:parseInt(p.slice(1,3),16),g:parseInt(p.slice(3,5),16),b:parseInt(p.slice(5,7),16)};const t=x=>Math.min(255,Math.round(x+(255-x)*.9)).toString(16).padStart(2,'0');return'#'+t(r)+t(g)+t(b);})());
      root.style.setProperty('--primary-dark', (()=>{const{r,g,b}={r:parseInt(p.slice(1,3),16),g:parseInt(p.slice(3,5),16),b:parseInt(p.slice(5,7),16)};const t=x=>Math.max(0,Math.round(x*.85)).toString(16).padStart(2,'0');return'#'+t(r)+t(g)+t(b);})());
      document.getElementById('meta-theme').content = p;
    }
    root.style.setProperty('--lp-from', s.login_gradient_from || p || '#1565C0');
    root.style.setProperty('--lp-to',   s.login_gradient_to   || '#0D47A1');
    if (s.favicon_url) document.getElementById('dyn-favicon').href = s.favicon_url;
  } catch(e) {}
})();

const token = localStorage.getItem('authToken');
if (!token) location.replace('login.html');

function togglePwd(id, btn) {
  const inp = document.getElementById(id);
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.textContent = show ? '🙈' : '👁';
}

async function submit() {
  const current = document.getElementById('current').value;
  const n1      = document.getElementById('new1').value;
  const n2      = document.getElementById('new2').value;
  const err     = document.getElementById('err');
  const btn     = document.getElementById('submit-btn');
  err.style.display = 'none';
  if (!current)      { err.textContent = 'Mot de passe actuel requis'; err.style.display = ''; return; }
  if (n1.length < 8) { err.textContent = 'Minimum 8 caractères'; err.style.display = ''; return; }
  if (n1 !== n2)     { err.textContent = 'Les mots de passe ne correspondent pas'; err.style.display = ''; return; }
  btn.disabled = true; btn.textContent = 'Enregistrement…';
  const r = await fetch('/api/auth/change-password', {
    method:'PUT', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body: JSON.stringify({ current, newPassword: n1 })
  });
  const d = await r.json();
  btn.disabled = false; btn.textContent = 'Enregistrer';
  if (!r.ok) { err.textContent = d.error; err.style.display = ''; return; }
  const user = JSON.parse(localStorage.getItem('authUser') || '{}');
  location.replace(user.role === 'admin' ? 'admin.html' : 'creator.html');
}
</script>
</body>
</html>
