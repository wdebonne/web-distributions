<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Changer de mot de passe</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display:flex;align-items:center;justify-content:center;height:100vh;
      background:linear-gradient(135deg,#1565C0,#0D47A1);padding:16px; }
    .box { width:100%;max-width:400px;background:#fff;border-radius:16px;padding:36px 28px;box-shadow:0 8px 40px rgba(0,0,0,.2); }
  </style>
</head>
<body>
<div class="box">
  <div style="font-size:44px;text-align:center;margin-bottom:12px;">🔐</div>
  <h2 style="text-align:center;font-size:20px;margin-bottom:4px;">Changer votre mot de passe</h2>
  <p style="text-align:center;color:#607D8B;font-size:14px;margin-bottom:24px;">
    Pour des raisons de sécurité, veuillez définir un nouveau mot de passe.
  </p>
  <div class="form-group">
    <label>Mot de passe actuel</label>
    <input type="password" id="current" placeholder="••••••••">
  </div>
  <div class="form-group">
    <label>Nouveau mot de passe</label>
    <input type="password" id="new1" placeholder="Minimum 8 caractères">
  </div>
  <div class="form-group">
    <label>Confirmer</label>
    <input type="password" id="new2" placeholder="••••••••">
  </div>
  <button class="btn btn-primary w-full" onclick="submit()">Enregistrer</button>
  <p id="err" style="color:#C62828;font-size:13px;margin-top:8px;display:none;"></p>
</div>
<script>
const token = localStorage.getItem('authToken');
if (!token) location.replace('login.html');

async function submit() {
  const current = document.getElementById('current').value;
  const n1 = document.getElementById('new1').value;
  const n2 = document.getElementById('new2').value;
  const err = document.getElementById('err');
  if (!current) { err.textContent='Mot de passe actuel requis'; err.style.display=''; return; }
  if (n1.length < 8) { err.textContent='Minimum 8 caractères'; err.style.display=''; return; }
  if (n1 !== n2) { err.textContent='Les mots de passe ne correspondent pas'; err.style.display=''; return; }
  err.style.display='none';
  const r = await fetch('/api/auth/change-password', {
    method: 'PUT', headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
    body: JSON.stringify({ current, newPassword: n1 })
  });
  const d = await r.json();
  if (!r.ok) { err.textContent = d.error; err.style.display=''; return; }
  const user = JSON.parse(localStorage.getItem('authUser') || '{}');
  location.replace(user.role === 'admin' ? 'admin.html' : 'creator.html');
}
</script>
</body>
</html>
