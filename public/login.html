<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1565C0" id="meta-theme">
  <title>Connexion</title>
  <link rel="stylesheet" href="style.css">
  <link id="dyn-favicon" rel="icon" href="data:,">
  <style>
    html, body { height: 100%; overflow: auto; }
    body { display: flex; align-items: stretch; background: #0a1929; }

    /* ── Hero panel (desktop left side) ── */
    .lp-hero {
      display: none;
      flex: 1;
      position: relative;
      overflow: hidden;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      padding: 48px 40px;
      background: linear-gradient(150deg, var(--lp-from, #1565C0) 0%, var(--lp-to, #0D47A1) 100%);
    }
    @media (min-width: 820px) { .lp-hero { display: flex; } }

    .lp-hero-blob {
      position: absolute; border-radius: 50%; opacity: .1; background: #fff;
    }
    .lp-hero-blob:nth-child(1) {
      width: 520px; height: 520px; top: -200px; left: -180px;
      animation: blobFloat 9s ease-in-out infinite;
    }
    .lp-hero-blob:nth-child(2) {
      width: 380px; height: 380px; bottom: -150px; right: -120px;
      animation: blobFloat 11s ease-in-out infinite reverse;
    }
    .lp-hero-blob:nth-child(3) {
      width: 220px; height: 220px; top: 50%; left: 60%;
      animation: blobFloat 7s ease-in-out infinite 2s;
    }
    @keyframes blobFloat {
      0%,100% { transform: translate(0,0) scale(1); }
      33%      { transform: translate(20px,-15px) scale(1.04); }
      66%      { transform: translate(-15px,20px) scale(.97); }
    }

    .lp-hero-content { position: relative; z-index: 1; }
    .lp-hero-logo  { font-size: 80px; margin-bottom: 20px; line-height: 1; }
    .lp-hero-title { font-size: 28px; font-weight: 800; letter-spacing: -.4px; margin-bottom: 10px; }
    .lp-hero-sub   { font-size: 15px; opacity: .8; max-width: 280px; line-height: 1.7; margin: 0 auto; }

    /* Feature list on hero */
    .lp-hero-features {
      margin-top: 40px; display: flex; flex-direction: column; gap: 12px; text-align: left;
    }
    .lp-hero-feature {
      display: flex; align-items: center; gap: 12px;
      font-size: 14px; opacity: .85;
    }
    .lp-hero-feature-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }

    /* ── Form panel (right side, always visible) ── */
    .lp-panel {
      width: 100%; max-width: 480px;
      min-height: 100vh;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 32px;
      position: relative;
    }
    @media (max-width: 819px) {
      .lp-panel {
        max-width: 100%;
        background: linear-gradient(150deg, var(--lp-from, #1565C0) 0%, var(--lp-to, #0D47A1) 100%);
        padding: 24px 16px;
        justify-content: center;
      }
    }

    /* White card wrapper on mobile */
    .lp-card {
      width: 100%; max-width: 400px;
      animation: cardIn .35s ease;
    }
    @keyframes cardIn { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }

    @media (max-width: 819px) {
      .lp-card {
        background: #fff;
        border-radius: 20px;
        padding: 32px 24px 28px;
        box-shadow: 0 24px 64px rgba(0,0,0,.28);
      }
    }

    /* Mobile-only: logo above form */
    .lp-mob-header {
      text-align: center;
      margin-bottom: 28px;
    }
    @media (min-width: 820px) { .lp-mob-header { display: none; } }
    .lp-mob-logo { font-size: 48px; line-height: 1; }
    .lp-mob-name { font-size: 20px; font-weight: 800; color: var(--text); margin-top: 8px; }

    /* Desktop-only: heading above form */
    .lp-desk-header { margin-bottom: 28px; }
    @media (max-width: 819px) { .lp-desk-header { display: none; } }
    .lp-desk-header h1 {
      font-size: 26px; font-weight: 800;
      color: var(--text); letter-spacing: -.4px; margin-bottom: 6px;
    }
    .lp-desk-header p { font-size: 14px; color: var(--text-light); }

    /* Form inputs */
    .lp-field { margin-bottom: 18px; }
    .lp-label {
      display: block; font-size: 13px; font-weight: 600;
      color: var(--text-light); margin-bottom: 7px; letter-spacing: .02em;
    }
    .lp-input-wrap { position: relative; }
    .lp-input-prefix {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      font-size: 15px; pointer-events: none; opacity: .55;
    }
    .lp-input {
      width: 100%; padding: 13px 44px 13px 42px;
      border: 1.5px solid var(--border); border-radius: 10px;
      font-size: 16px; font-family: inherit; background: #fff;
      color: var(--text);
      transition: border-color .18s, box-shadow .18s;
      -webkit-appearance: none;
    }
    .lp-input:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(21,101,192,.14);
    }
    .lp-input::placeholder { color: #B0BEC5; }
    .lp-input.no-prefix { padding-left: 14px; }
    .lp-pwd-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--text-light); font-size: 17px; padding: 4px 6px;
      display: flex; align-items: center; border-radius: 6px;
      transition: color .15s;
    }
    .lp-pwd-toggle:hover { color: var(--text); }

    .lp-forgot {
      text-align: right; margin-top: -10px; margin-bottom: 20px;
    }
    .lp-forgot a {
      font-size: 13px; color: var(--primary); text-decoration: none; font-weight: 500;
    }
    .lp-forgot a:hover { text-decoration: underline; }

    .lp-submit {
      width: 100%; padding: 15px; border: none;
      border-radius: 10px;
      background: var(--primary); color: #fff;
      font-size: 15px; font-weight: 700; cursor: pointer;
      transition: background .18s, box-shadow .18s, transform .1s;
      box-shadow: 0 4px 16px rgba(21,101,192,.35);
      letter-spacing: .01em;
    }
    .lp-submit:hover:not(:disabled) {
      background: var(--primary-dark);
      box-shadow: 0 6px 20px rgba(21,101,192,.45);
    }
    .lp-submit:active:not(:disabled) { transform: scale(.98); }
    .lp-submit:disabled { opacity: .6; cursor: not-allowed; box-shadow: none; }

    /* Error + info messages */
    .lp-error {
      display: none;
      background: #FFEBEE; border: 1px solid #FFCDD2;
      color: #C62828; border-radius: 8px;
      padding: 11px 14px; font-size: 13px;
      margin-bottom: 16px;
    }
    .lp-info {
      display: none;
      background: var(--primary-light); border: 1px solid #90CAF9;
      color: var(--primary-dark); border-radius: 8px;
      padding: 11px 14px; font-size: 13px;
      margin-bottom: 16px; line-height: 1.5;
    }

    /* Footer */
    .lp-footer {
      text-align: center; font-size: 12px;
      color: var(--text-light); margin-top: 24px; opacity: .7;
    }
    @media (max-width: 819px) {
      .lp-footer { color: rgba(255,255,255,.55); margin-top: 20px; }
    }
  </style>
</head>
<body>

<!-- ── Hero (desktop only) ────────────────────── -->
<div class="lp-hero">
  <div class="lp-hero-blob"></div>
  <div class="lp-hero-blob"></div>
  <div class="lp-hero-blob"></div>
  <div class="lp-hero-content">
    <div class="lp-hero-logo" id="hero-logo">🗺️</div>
    <div class="lp-hero-title" id="hero-title">Distribution Tracker</div>
    <div class="lp-hero-sub" id="hero-sub">Suivi de distribution de courriers</div>
    <div class="lp-hero-features">
      <div class="lp-hero-feature">
        <div class="lp-hero-feature-icon">📍</div>
        <span>Suivi GPS en temps réel</span>
      </div>
      <div class="lp-hero-feature">
        <div class="lp-hero-feature-icon">📱</div>
        <span>Optimisé pour mobile</span>
      </div>
      <div class="lp-hero-feature">
        <div class="lp-hero-feature-icon">📊</div>
        <span>Rapports et statistiques</span>
      </div>
    </div>
  </div>
</div>

<!-- ── Form panel ─────────────────────────────── -->
<div class="lp-panel">
  <div class="lp-card">

    <!-- Mobile logo (hidden on desktop) -->
    <div class="lp-mob-header">
      <div class="lp-mob-logo" id="mob-logo">🗺️</div>
      <div class="lp-mob-name" id="mob-name">Distribution Tracker</div>
    </div>

    <!-- Desktop heading (hidden on mobile) -->
    <div class="lp-desk-header">
      <h1>Connexion</h1>
      <p>Bienvenue, connectez-vous pour continuer</p>
    </div>

    <!-- Login message (optional, from settings) -->
    <div class="lp-info" id="login-info"></div>

    <!-- Error -->
    <div class="lp-error" id="error-msg"></div>

    <form id="login-form" autocomplete="on">
      <div class="lp-field">
        <label class="lp-label" for="email">Adresse email</label>
        <div class="lp-input-wrap">
          <span class="lp-input-prefix">✉</span>
          <input class="lp-input" type="email" id="email" name="email"
            placeholder="votre@email.fr" autocomplete="email" required>
        </div>
      </div>

      <div class="lp-field">
        <label class="lp-label" for="password">Mot de passe</label>
        <div class="lp-input-wrap">
          <span class="lp-input-prefix">🔒</span>
          <input class="lp-input" type="password" id="password" name="password"
            placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="lp-pwd-toggle" id="pwd-toggle" aria-label="Afficher le mot de passe">
            👁
          </button>
        </div>
      </div>

      <div class="lp-forgot">
        <a href="forgot-password.html">Mot de passe oublié ?</a>
      </div>

      <button type="submit" class="lp-submit" id="submit-btn">Se connecter</button>
    </form>

    <div class="lp-footer" id="lp-footer">Distribution Tracker</div>
  </div>
</div>

<script>
// ── Redirect if already logged in ─────────────────────
const token = localStorage.getItem('authToken');
if (token) {
  try {
    const p = JSON.parse(atob(token.split('.')[1]));
    if (p.exp > Date.now() / 1000) location.replace(p.role === 'admin' ? 'admin.html' : 'creator.html');
    else localStorage.removeItem('authToken');
  } catch {}
}

// ── Color helpers ──────────────────────────────────────
function _hexRgb(h) { return { r:parseInt(h.slice(1,3),16), g:parseInt(h.slice(3,5),16), b:parseInt(h.slice(5,7),16) }; }
function _darken(h, f) {
  const {r,g,b}=_hexRgb(h);
  const t=x=>Math.max(0,Math.round(x*(1-f))).toString(16).padStart(2,'0');
  return '#'+t(r)+t(g)+t(b);
}
function _lighten(h, f) {
  const {r,g,b}=_hexRgb(h);
  const t=x=>Math.min(255,Math.round(x+(255-x)*f)).toString(16).padStart(2,'0');
  return '#'+t(r)+t(g)+t(b);
}

// ── Load branding from API ────────────────────────────
async function loadBranding() {
  try {
    const r = await fetch('/api/settings');
    if (!r.ok) return;
    const s = await r.json();

    const root = document.documentElement;
    const primary = s.primary_color;
    if (primary && /^#[0-9a-fA-F]{6}$/.test(primary)) {
      root.style.setProperty('--primary', primary);
      root.style.setProperty('--primary-dark', _darken(primary, .15));
      root.style.setProperty('--primary-light', _lighten(primary, .9));
      document.getElementById('meta-theme').content = primary;
    }
    const gradFrom = s.login_gradient_from || primary || '#1565C0';
    const gradTo   = s.login_gradient_to   || '#0D47A1';
    root.style.setProperty('--lp-from', gradFrom);
    root.style.setProperty('--lp-to',   gradTo);

    if (s.favicon_url) document.getElementById('dyn-favicon').href = s.favicon_url;

    const siteName  = s.site_name  || 'Distribution Tracker';
    const logoEmoji = s.logo_emoji || '🗺️';
    const tagline   = s.site_tagline || 'Suivi de distribution de courriers';

    document.title = `Connexion — ${siteName}`;
    document.getElementById('hero-logo').textContent  = logoEmoji;
    document.getElementById('hero-title').textContent = siteName;
    document.getElementById('hero-sub').textContent   = tagline;
    document.getElementById('mob-logo').textContent   = logoEmoji;
    document.getElementById('mob-name').textContent   = siteName;
    document.getElementById('lp-footer').textContent  = s.footer_text || siteName;

    if (s.login_message) {
      const el = document.getElementById('login-info');
      el.textContent = s.login_message;
      el.style.display = '';
    }
  } catch(e) {}
}
loadBranding();

// ── Password toggle ───────────────────────────────────
document.getElementById('pwd-toggle').addEventListener('click', function() {
  const inp = document.getElementById('password');
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  this.textContent = show ? '🙈' : '👁';
});

// ── Login form ────────────────────────────────────────
document.getElementById('login-form').onsubmit = async e => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const err = document.getElementById('error-msg');
  btn.disabled = true; btn.textContent = 'Connexion…'; err.style.display = 'none';

  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email:    document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    const data = await r.json();
    btn.disabled = false; btn.textContent = 'Se connecter';

    if (!r.ok) {
      err.textContent = data.error || 'Identifiants incorrects';
      err.style.display = '';
      return;
    }

    localStorage.setItem('authToken', data.token);
    localStorage.setItem('authUser', JSON.stringify(data.user));

    if (data.user.forceChange) { location.replace('change-password.html'); return; }
    location.replace(data.user.role === 'admin' ? 'admin.html' : 'creator.html');
  } catch(e) {
    btn.disabled = false; btn.textContent = 'Se connecter';
    err.textContent = 'Erreur réseau, veuillez réessayer.';
    err.style.display = '';
  }
};
</script>
</body>
</html>
