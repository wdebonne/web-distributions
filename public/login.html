<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1565C0">
  <title>Connexion — Distribution Tracker</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display:flex;align-items:center;justify-content:center;height:100vh;overflow:auto;
      background:linear-gradient(135deg,#1565C0,#0D47A1); }
    .login-box { width:100%;max-width:400px;padding:16px; }
    .login-card { background:#fff;border-radius:16px;padding:40px 32px;box-shadow:0 8px 40px rgba(0,0,0,.25); }
    .login-logo { font-size:52px;text-align:center;margin-bottom:8px; }
    .login-title { text-align:center;font-size:22px;font-weight:700;margin-bottom:4px; }
    .login-sub   { text-align:center;color:#607D8B;font-size:14px;margin-bottom:28px; }
    .forgot-link { text-align:right;margin-top:-8px;margin-bottom:16px; }
    .forgot-link a { color:var(--primary);font-size:13px;text-decoration:none; }
    .forgot-link a:hover { text-decoration:underline; }
    .version { text-align:center;color:rgba(255,255,255,.5);font-size:12px;margin-top:16px; }
  </style>
</head>
<body>
<div class="login-box">
  <div class="login-card">
    <div class="login-logo">🗺️</div>
    <div class="login-title">Distribution Tracker</div>
    <div class="login-sub">Connectez-vous pour continuer</div>

    <form id="login-form" autocomplete="on">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="votre@email.fr" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <div class="forgot-link"><a href="forgot-password.html">Mot de passe oublié ?</a></div>
      <button type="submit" class="btn btn-primary w-full" id="submit-btn">Se connecter</button>
      <p id="error-msg" style="color:#C62828;font-size:13px;margin-top:10px;text-align:center;display:none;"></p>
    </form>
  </div>
  <div class="version">Distribution Tracker v2.0.0</div>
</div>
<script>
// Redirect if already logged in
const token = localStorage.getItem('authToken');
if (token) {
  try {
    const p = JSON.parse(atob(token.split('.')[1]));
    if (p.exp > Date.now() / 1000) {
      location.replace(p.role === 'admin' ? 'admin.html' : 'creator.html');
    } else {
      localStorage.removeItem('authToken');
    }
  } catch {}
}

document.getElementById('login-form').onsubmit = async e => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const err = document.getElementById('error-msg');
  btn.disabled = true; btn.textContent = 'Connexion…'; err.style.display = 'none';

  const r = await fetch('/api/auth/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
  });
  const data = await r.json();
  btn.disabled = false; btn.textContent = 'Se connecter';

  if (!r.ok) { err.textContent = data.error || 'Erreur de connexion'; err.style.display = 'block'; return; }

  localStorage.setItem('authToken', data.token);
  localStorage.setItem('authUser', JSON.stringify(data.user));

  if (data.user.forceChange) { location.replace('change-password.html'); return; }
  location.replace(data.user.role === 'admin' ? 'admin.html' : 'creator.html');
};
</script>
</body>
</html>
