<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1565C0" id="meta-theme">
  <title>Nouveau mot de passe</title>
  <link rel="stylesheet" href="style.css">
  <link id="dyn-favicon" rel="icon" href="data:,">
  <style>
    html, body { height:100%; overflow:auto; }
    body {
      display:flex; align-items:center; justify-content:center;
      padding:20px; min-height:100vh;
      background:linear-gradient(150deg, var(--lp-from,#1565C0) 0%, var(--lp-to,#0D47A1) 100%);
    }
    .auth-card {
      width:100%; max-width:400px;
      background:#fff; border-radius:20px;
      padding:36px 28px; box-shadow:0 24px 64px rgba(0,0,0,.28);
      animation:cardIn .35s ease;
    }
    @keyframes cardIn { from{opacity:0;transform:translateY(14px);} to{opacity:1;transform:translateY(0);} }
    .auth-icon  { font-size:44px; text-align:center; margin-bottom:14px; }
    .auth-title { font-size:21px; font-weight:800; text-align:center; margin-bottom:6px; color:var(--text); }
    .auth-sub   { font-size:14px; color:var(--text-light); text-align:center; margin-bottom:24px; }
    .auth-error {
      background:#FFEBEE; border:1px solid #FFCDD2; color:#C62828;
      border-radius:8px; padding:10px 14px; font-size:13px;
      margin-bottom:14px; display:none;
    }
    .auth-result { text-align:center; padding:8px 0; }
    .auth-result-icon  { font-size:48px; margin-bottom:14px; }
    .auth-result-title { font-weight:700; font-size:16px; margin-bottom:10px; }
    .auth-result-text  { font-size:14px; color:var(--text-light); margin-bottom:20px; }
    .pwd-wrap { position:relative; }
    .pwd-toggle {
      position:absolute; right:12px; top:50%; transform:translateY(-50%);
      background:none; border:none; cursor:pointer; color:var(--text-light);
      font-size:16px; padding:4px; border-radius:6px;
    }
  </style>
</head>
<body>
<div class="auth-card">

  <div id="form-area">
    <div class="auth-icon">🔒</div>
    <div class="auth-title">Nouveau mot de passe</div>
    <div class="auth-sub">Minimum 8 caractères.</div>
    <div class="auth-error" id="err"></div>
    <div class="form-group">
      <label>Nouveau mot de passe</label>
      <div class="pwd-wrap">
        <input type="password" id="pwd1" placeholder="Minimum 8 caractères" minlength="8">
        <button type="button" class="pwd-toggle" onclick="togglePwd('pwd1',this)">👁</button>
      </div>
    </div>
    <div class="form-group">
      <label>Confirmer le mot de passe</label>
      <div class="pwd-wrap">
        <input type="password" id="pwd2" placeholder="••••••••">
        <button type="button" class="pwd-toggle" onclick="togglePwd('pwd2',this)">👁</button>
      </div>
    </div>
    <button class="btn btn-primary w-full" onclick="submit()">Enregistrer le mot de passe</button>
  </div>

  <div id="success" class="auth-result" style="display:none;">
    <div class="auth-result-icon">✅</div>
    <div class="auth-result-title">Mot de passe modifié !</div>
    <div class="auth-result-text">Vous pouvez maintenant vous connecter avec votre nouveau mot de passe.</div>
    <a href="login.html" class="btn btn-primary" style="display:inline-flex;">Se connecter</a>
  </div>

  <div id="invalid" class="auth-result" style="display:none;">
    <div class="auth-result-icon">❌</div>
    <div class="auth-result-title" style="color:#C62828;">Lien invalide ou expiré</div>
    <div class="auth-result-text">Ce lien de réinitialisation n'est plus valide.</div>
    <a href="forgot-password.html" class="btn btn-ghost" style="display:inline-flex;">Demander un nouveau lien</a>
  </div>

</div>

<script>
(async function applyBranding() {
  try {
    const r = await fetch('/api/settings'); if (!r.ok) return;
    const s = await r.json();
    const root = document.documentElement;
    const p = s.primary_color;
    if (p && /^#[0-9a-fA-F]{6}$/.test(p)) {
      root.style.setProperty('--primary', p);
      document.getElementById('meta-theme').content = p;
    }
    root.style.setProperty('--lp-from', s.login_gradient_from || p || '#1565C0');
    root.style.setProperty('--lp-to',   s.login_gradient_to   || '#0D47A1');
    if (s.favicon_url) document.getElementById('dyn-favicon').href = s.favicon_url;
  } catch(e) {}
})();

const token = new URLSearchParams(location.search).get('token');
if (!token) {
  document.getElementById('form-area').style.display = 'none';
  document.getElementById('invalid').style.display   = '';
}

function togglePwd(id, btn) {
  const inp = document.getElementById(id);
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.textContent = show ? '🙈' : '👁';
}

async function submit() {
  const p1  = document.getElementById('pwd1').value;
  const p2  = document.getElementById('pwd2').value;
  const err = document.getElementById('err');
  err.style.display = 'none';
  if (p1.length < 8) { err.textContent = 'Minimum 8 caractères'; err.style.display = ''; return; }
  if (p1 !== p2)     { err.textContent = 'Les mots de passe ne correspondent pas'; err.style.display = ''; return; }
  const r = await fetch('/api/auth/reset-password', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ token, newPassword: p1 })
  });
  const d = await r.json();
  if (!r.ok) { err.textContent = d.error; err.style.display = ''; return; }
  document.getElementById('form-area').style.display = 'none';
  document.getElementById('success').style.display = '';
}
</script>
</body>
</html>
