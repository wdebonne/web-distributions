<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouveau mot de passe</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display:flex;align-items:center;justify-content:center;height:100vh;
      background:linear-gradient(135deg,#1565C0,#0D47A1);padding:16px; }
    .box { width:100%;max-width:400px;background:#fff;border-radius:16px;padding:36px 28px;box-shadow:0 8px 40px rgba(0,0,0,.2); }
  </style>
</head>
<body>
<div class="box">
  <div style="font-size:44px;text-align:center;margin-bottom:12px;">🔒</div>
  <h2 style="text-align:center;font-size:20px;margin-bottom:6px;">Nouveau mot de passe</h2>
  <p style="text-align:center;color:#607D8B;font-size:14px;margin-bottom:24px;">Minimum 8 caractères.</p>

  <div id="form-area">
    <div class="form-group">
      <label>Nouveau mot de passe</label>
      <input type="password" id="pwd1" placeholder="••••••••" minlength="8">
    </div>
    <div class="form-group">
      <label>Confirmer</label>
      <input type="password" id="pwd2" placeholder="••••••••">
    </div>
    <button class="btn btn-primary w-full" onclick="submit()">Enregistrer</button>
    <p id="err" style="color:#C62828;font-size:13px;margin-top:8px;display:none;"></p>
  </div>

  <div id="success" style="display:none;text-align:center;">
    <div style="font-size:40px;margin-bottom:12px;">✅</div>
    <p style="font-weight:600;">Mot de passe modifié !</p>
    <a href="login.html" class="btn btn-primary" style="margin-top:16px;display:inline-flex;">Se connecter</a>
  </div>

  <div id="invalid" style="display:none;text-align:center;">
    <div style="font-size:40px;margin-bottom:12px;">❌</div>
    <p style="color:#C62828;">Lien invalide ou expiré.</p>
    <a href="forgot-password.html" class="btn btn-ghost" style="margin-top:12px;display:inline-flex;">Demander un nouveau lien</a>
  </div>
</div>
<script>
const token = new URLSearchParams(location.search).get('token');
if (!token) { document.getElementById('form-area').style.display='none'; document.getElementById('invalid').style.display=''; }

async function submit() {
  const p1 = document.getElementById('pwd1').value;
  const p2 = document.getElementById('pwd2').value;
  const err = document.getElementById('err');
  if (p1.length < 8) { err.textContent='Minimum 8 caractères'; err.style.display=''; return; }
  if (p1 !== p2)     { err.textContent='Les mots de passe ne correspondent pas'; err.style.display=''; return; }
  err.style.display='none';
  const r = await fetch('/api/auth/reset-password', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token, newPassword: p1 })
  });
  const d = await r.json();
  if (!r.ok) { err.textContent = d.error; err.style.display=''; return; }
  document.getElementById('form-area').style.display='none';
  document.getElementById('success').style.display='';
}
</script>
</body>
</html>
